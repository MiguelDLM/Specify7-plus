<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>3D Viewer — Specify7+</title>
    <link rel="stylesheet" href="viewer.css">
</head>
<body>

    <!-- Top-left: measure instructions -->
    <div id="measure-hint">
        <b><u>To Measure</u></b><br>
        <span class="key-s"><b>S:</b></span> Start point<br>
        <span class="key-e"><b>E:</b></span> End point<br>
        <b>ESC:</b> Clear
    </div>

    <!-- Top-right: settings panel (dat.GUI style) -->
    <div id="settings-panel">
        <div class="settings-title">⚙ Settings</div>

        <div class="setting-group">
            <label title="Change the scene background color">Background</label>
            <div id="bg-swatches">
                <div class="swatch active" data-color="#00274c" title="Michigan Blue" style="background:#00274c"></div>
                <div class="swatch" data-color="#1a1a1a" title="Dark" style="background:#1a1a1a"></div>
                <div class="swatch" data-color="#2d2d2d" title="Charcoal" style="background:#2d2d2d"></div>
                <div class="swatch" data-color="#ffffff" title="White" style="background:#ffffff;border-color:#aaa"></div>
                <div class="swatch" data-color="#f5f0e8" title="Ivory" style="background:#f5f0e8;border-color:#aaa"></div>
                <div class="swatch" data-color="#1a3a1a" title="Forest" style="background:#1a3a1a"></div>
            </div>
        </div>

        <div class="setting-group">
            <label title="Adjust model opacity (0% transparent, 100% opaque)">Opacity <span id="opacity-val">100%</span></label>
            <input type="range" id="opacity-slider" min="0" max="100" value="100" title="Adjust model opacity (transparency)">
        </div>

        <div class="setting-group">
            <label title="Adjust ambient light intensity (overall scene brightness)">Ambient Light <span id="ambient-val">60%</span></label>
            <input type="range" id="ambient-slider" min="0" max="100" value="60" title="Adjust ambient light intensity">
        </div>

        <div class="setting-group">
            <label title="Adjust directional light intensity (shadows and highlights)">Directional Light <span id="dir-val">80%</span></label>
            <input type="range" id="dir-slider" min="0" max="100" value="80" title="Adjust directional light intensity">
        </div>

        <div class="setting-group">
            <label title="Toggle wireframe rendering to show mesh edges">Wireframe</label>
            <label class="toggle-switch">
                <input type="checkbox" id="wireframe-toggle" title="Toggle wireframe rendering to show mesh edges">
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="setting-group">
            <label title="Render both sides of each triangle; enable only if faces are invisible from some angles">Double-sided</label>
            <label class="toggle-switch">
                <input type="checkbox" id="doubleside-toggle" title="Render both sides of triangles; enable if parts disappear when viewed from the back">
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="setting-group">
            <label title="Use per-vertex colors embedded in the model file if available">Model Color</label>
            <label class="toggle-switch">
                <input type="checkbox" id="vertexcolor-toggle" checked title="Use per-vertex colors if present in the file">
                <span class="toggle-slider"></span>
            </label>
        </div>

        <div class="setting-group">
            <label title="Pick a base color to apply to the model">Base Color</label>
            <input type="color" id="basecolor-picker" value="#cccccc" title="Pick a base color for the model">
            <div id="color-presets" style="margin-top:6px">
                <button class="color-preset" data-color="#e6dfc8" title="Bone">Bone</button>
                <button class="color-preset" data-color="#ffffff" title="White">White</button>
                <button class="color-preset" data-color="#cccccc" title="Grey">Grey</button>
                <button class="color-preset" data-color="#d1c7b0" title="Natural">Natural</button>
            </div>
        </div>

        <div class="setting-group">
            <label title="Use any textures embedded in the model (OBJ/MTL). If disabled, the base color is used">Use model textures</label>
            <label class="toggle-switch">
                <input type="checkbox" id="use-texture-toggle" checked title="Enable to show model textures when available">
                <span class="toggle-slider"></span>
            </label>
        </div>

        <hr class="settings-divider">

        <button id="reset-camera-btn" title="Reset camera to the initial fit position">↺ Reset Camera</button>
        <button id="download-btn" title="Open the original model file in a new tab to download">⤓ Download Model</button>
    </div>

    <!-- Main 3D canvas -->
    <div id="threejs-container"></div>

    <!-- Measurement result badge -->
    <div id="measure-result" class="hidden">
        <span id="measure-distance"></span>
        <button id="clear-measure-btn" title="Clear measurement">✕</button>
    </div>

    <!-- Measurement dot markers -->
    <div id="dot-start" class="measure-dot dot-start hidden"></div>
    <div id="dot-end" class="measure-dot dot-end hidden"></div>

    <!-- Loading overlay -->
    <div id="loading">
        <div class="spinner-ring"></div>
        <p id="loading-label">Loading 3D model…</p>
    </div>

    <!-- Error overlay -->
    <div id="error" class="hidden">
        <div class="error-icon">⚠</div>
        <h2>Could not load model</h2>
        <p id="error-message"></p>
    </div>

    <!-- Bottom-left: model info -->
    <div id="model-info">
        <span id="model-title-label">3D Model</span>
    </div>

    <!-- Bottom-right: credits -->
    <div id="credits">
        Viewer powered by <a href="https://threejs.org" target="_blank">three.js</a>
    </div>

    <!-- Measurement line overlay canvas -->
    <canvas id="measure-canvas"></canvas>

    <script type="module" src="viewer.js"></script>
</body>
</html>
