<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor 3D - Specify 7</title>
    <!-- 3DHOP Styles -->
    <link rel="stylesheet" href="../../lib/3dhop/stylesheet/3dhop.css">
    <!-- Extension Styles -->
    <link rel="stylesheet" href="viewer.css">
    
    <!-- 3DHOP Dependencies (must be non-module for compatibility) -->
    <script src="../../lib/3dhop/js/jquery.js"></script>
    <script src="../../lib/3dhop/js/spidergl.js"></script>
    <script src="../../lib/3dhop/js/nexus.js"></script>
    <script src="../../lib/3dhop/js/presenter.js"></script>
    <script src="../../lib/3dhop/js/init.js"></script>
    <script src="../../lib/3dhop/js/trackball_sphere.js"></script>
    <script src="../../lib/3dhop/js/helpers.js"></script>
    <script src="../../lib/3dhop/js/corto.js"></script>
</head>
<body>
    <div id="header">
        <h1 id="model-title">Loading 3D model...</h1>
        <div id="controls">
            <button id="download-btn" title="Download model">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                Download
            </button>
        </div>
    </div>

    <!-- Híbrid Viewer Container -->
    <div id="viewer-wrapper">
        <!-- 3DHOP Container (Used for Nexus/PLY) -->
        <div id="3dhop" class="tdhop" style="display:none;">
            <div id="toolbar">
                <img id="home"     title="Home"                  src="../../lib/3dhop/skins/dark/home.png" onclick="actionsToolbar('home')"/><br/>
                <img id="zoomin"   title="Zoom In"               src="../../lib/3dhop/skins/dark/zoomin.png" onclick="actionsToolbar('zoomin')"/><br/>
                <img id="zoomout"  title="Zoom Out"              src="../../lib/3dhop/skins/dark/zoomout.png" onclick="actionsToolbar('zoomout')"/><br/>
                <img id="light"    title="Disable Light Control" src="../../lib/3dhop/skins/dark/light.png" onclick="actionsToolbar('light')"/><br/>
                <img id="full"     title="Enter Fullscreen"      src="../../lib/3dhop/skins/dark/full.png" onclick="actionsToolbar('full')"/><br/>
            </div>
            <canvas id="draw-canvas"></canvas>
        </div>

        <!-- Three.js Container (Used for STL/OBJ/GLTF) -->
        <div id="threejs-container"></div>
    </div>
    
    <div id="loading">
        <div class="spinner"></div>
        <p>Loading 3D model...</p>
    </div>
    
    <div id="error" class="hidden">
        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <h2>Error loading model</h2>
        <p id="error-message"></p>
    </div>

    <!-- Load viewer engine logic as an ES module -->
    <script type="module" src="viewer.js"></script>
</body>
</html>
